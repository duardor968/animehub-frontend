# CI in the KVM8 Woodpecker (https://ci.asrlabs.space). Coolify deploys main on its own.
when:
  - event: push
    branch: [main, dev]
  - event: [pull_request, manual]

steps:
  quality:
    image: node:24.21.0
    depends_on: []
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_INTERNAL_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    commands:
      - corepack enable && corepack prepare pnpm@12.10.1 --activate
      - pnpm install --frozen-lockfile
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      # Workers for the agent's 4 CPUs, not the host's 8: jsdom tests time out when oversubscribed.
      - pnpm test --maxWorkers=3
      - pnpm contract:check
      - pnpm test:audit
      - pnpm audit:ci
      - pnpm build

  secrets:
    image: zricethezav/gitleaks:v8.30.1
    depends_on: []
    commands:
      - git config --global --add safe.directory '*'
      # The whole history, as the old gitleaks job saw it: the clone is shallow.
      - git fetch --quiet --unshallow origin || [ "$(git rev-parse --is-shallow-repository)" = false ]
      - git rev-list --count HEAD
      - gitleaks git --redact --verbose .

  containers:
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    # After the tests, so the Next build in the image does not starve them of CPU.
    depends_on: [quality]
    settings:
      repo: animehub-frontend
      tags: test
      dry_run: true
