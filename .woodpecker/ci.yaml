# CI in the KVM8 Woodpecker (https://ci.asrlabs.space). Coolify deploys main on its own.
when:
  - event: push
    branch: [main, dev]
  - event: [pull_request, manual]

steps:
  quality:
    image: node:26.13.1
    depends_on: []
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_INTERNAL_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    commands:
      # pnpm and its package store live in the agent's persistent cache (/ci-cache).
      - export NPM_CONFIG_PREFIX=/ci-cache/npm-global
      - export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
      - '[ "$(pnpm --version 2>/dev/null)" = "12.23.0" ] || npm install -g pnpm@12.23.0'
      - pnpm install --frozen-lockfile --store-dir /ci-cache/pnpm
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      # Fewer workers than the host's 8 CPUs, which the agent shares with other pipelines.
      - pnpm test --maxWorkers=3
      - pnpm contract:check
      - pnpm test:audit
      - pnpm audit:ci
      - pnpm build

  secrets:
    image: zricethezav/gitleaks:v8.30.1
    depends_on: []
    commands:
      - git config --global --add safe.directory '*'
      # The whole history, as the old gitleaks job saw it: the clone is shallow.
      - git fetch --quiet --unshallow origin || [ "$(git rev-parse --is-shallow-repository)" = false ]
      - git rev-list --count HEAD
      - gitleaks git --redact --verbose .

  containers:
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    # After the tests, so the Next build in the image does not starve them of CPU.
    depends_on: [quality]
    settings:
      repo: animehub-frontend
      tags: test
      dry_run: true
